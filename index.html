
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Kanak</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: #333;
    }
    h1 {
      font-size: 3em;
      margin-top: 50px;
      color: #ff6f61;
    }
    p {
      font-size: 1.5em;
      margin: 20px auto;
      max-width: 700px;
      color: #555;
    }
    .heart {
      font-size: 5em;
      color: #ff4d4d;
      margin: 20px 0;
    }
    .container {
      padding: 20px;
    }
    button {
      padding: 15px 30px;
      font-size: 1.2em;
      margin-top: 20px;
      background-color: #ff6f61;
      border: none;
      border-radius: 25px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #ff4d4d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Happy Birthday, Kanak! 🎉</h1>
    <p>My dear love,</p>
    <p>Happy birthday to you! Always stay happy, healthy, and beautiful. I want to spend the rest of my life with you. ❤️</p>
    <div class="heart">❤️❤️❤️</div>
    <button onclick="alert('Love You, Kanak!')">Click Here</button>
  </div>
</body>
</html>
